xt.js, firebase, office.js</text><text x="162.0" y="261" font-size="12.5" fill="#b8b8b8">add-ins</text><rect x="24.0" y="282" width="8" height="8" rx="2" fill="#2e4a3d"/><text x="40.0" y="291" font-size="12.5" font-weight="600" fill="#e6e6e6">scripting &amp; data</text><text x="162.0" y="291" font-size="12.5" fill="#b8b8b8">python (fastapi, pandas etl, nlp), java, js,</text><text x="162.0" y="308" font-size="12.5" fill="#b8b8b8">php</text><rect x="24.0" y="329" width="8" height="8" rx="2" fill="#9fc9ad"/><text x="40.0" y="338" font-size="12.5" font-weight="600" fill="#e6e6e6">data stores</text><text x="162.0" y="338" font-size="12.5" fill="#b8b8b8">mysql, chromadb, firestore</text><rect x="24.0" y="359" width="8" height="8" rx="2" fill="#63a184"/><text x="40.0" y="368" font-size="12.5" font-weight="600" fill="#e6e6e6">security</text><text x="162.0" y="368" font-size="12.5" fill="#b8b8b8">defi vulnerability research, solidity, ztna</text><rect x="24.0" y="389" width="8" height="8" rx="2" fill="#3d6e57"/><text x="40.0" y="398" font-size="12.5" font-weight="600" fill="#e6e6e6">gis</text><text x="162.0" y="398" font-size="12.5" fill="#b8b8b8">arcgis products, qgis, global mapper,</text><text x="162.0" y="415" font-size="12.5" fill="#b8b8b8">geospatial data production</text><rect x="24.0" y="436" width="8" height="8" rx="2" fill="#2e4a3d"/><text x="40.0" y="445" font-size="12.5" font-weight="600" fill="#e6e6e6">3d &amp; games</text><text x="162.0" y="445" font-size="12.5" fill="#b8b8b8">blender, unity (but it&#x27;s been a decade)</text><text class="serif" x="479.0" y="90" font-size="17" fill="#e6e6e6">everything-else tree</text><rect x="479.0" y="107" width="8" height="8" rx="2" fill="#9fc9ad"/><text x="495.0" y="116" font-size="12.5" font-weight="600" fill="#e6e6e6">legaltech</text><text x="617.0" y="116" font-size="12.5" fill="#b8b8b8">clm, e-discovery (relativityone),</text><text x="617.0" y="133" font-size="12.5" fill="#b8b8b8">aml/kyc-ctf, document and practice</text><text x="617.0" y="150" font-size="12.5" fill="#b8b8b8">management</text><rect x="479.0" y="171" width="8" height="8" rx="2" fill="#63a184"/><text x="495.0" y="180" font-size="12.5" font-weight="600" fill="#e6e6e6">law</text><text x="617.0" y="180" font-size="12.5" fill="#b8b8b8">ip and brand protection, data protection,</text><text x="617.0" y="197" font-size="12.5" fill="#b8b8b8">contract, civil and criminal litigation</text><rect x="479.0" y="218" width="8" height="8" rx="2" fill="#3d6e57"/><text x="495.0" y="227" font-size="12.5" font-weight="600" fill="#e6e6e6">intelligence</text><text x="617.0" y="227" font-size="12.5" fill="#b8b8b8">imint, geoint, osint</text><rect x="479.0" y="248" width="8" height="8" rx="2" fill="#2e4a3d"/><text x="495.0" y="257" font-size="12.5" font-weight="600" fill="#e6e6e6">cartography</text><text x="617.0" y="257" font-size="12.5" fill="#b8b8b8">topographic maps, orthoimage maps,</text><text x="617.0" y="274" font-size="12.5" fill="#b8b8b8">situation maps (disaster relief/change</text><text x="617.0" y="291" font-size="12.5" fill="#b8b8b8">assessment)</text><rect x="479.0" y="312" width="8" height="8" rx="2" fill="#9fc9ad"/><text x="495.0" y="321" font-size="12.5" font-weight="600" fill="#e6e6e6">geomatics</text><text x="617.0" y="321" font-size="12.5" fill="#b8b8b8">georectification, orthorectification,</text><text x="617.0" y="338" font-size="12.5" fill="#b8b8b8">mosaicing, stereophotogrammetry</text><g class="m1"><g class=""><g class="v4"><g class="" transform="translate(23.8,20.6) scale(1.47725)"><svg width="24" height="40" overflow="hidden"><g class="f2"><use href="#im0"/></g></svg></g></g><g class="v5"><g class="" transform="translate(22.3,20.6) scale(1.47725)"><svg width="24" height="40" overflow="hidden"><g class="f3"><use href="#im1"/></g></svg></g></g></g></g><g class="m6"><g class=""><g class="v9"><g class="" transform="translate(496.9,21.4) scale(1.7105)"><svg width="32" height="32" overflow="hidden"><g class="f7"><use