name: Regrow the README garden

# Every two hours: the contribution garden with the sky over its forest (Singapore's time of day and
# NEA's 2-hour forecast), the message log of recent activity, and the README's open card spots.
# Also on each push to main (the bot's own regrow commits use GITHUB_TOKEN, so they never trigger it).
# Commits as github-actions[bot], so the regrow never counts towards your own contributions.
on:
  schedule:
    - cron: "17 1-23/2 * * *" # every two hours, off the busy top of the hour (GitHub may still run it late)
  push:
    branches: [main]
    paths-ignore: ["readme/art/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency: readme-garden

jobs:
  regrow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow and metric-compatible fonts
        run: |
          pip install pillow
          sudo apt-get install -y fonts-liberation
      - name: Fetch the contribution calendar and repositories
        env:
          GH_TOKEN: ${{ github.token }}
          LOG_TOKEN: ${{ secrets.LOG_TOKEN }}
        run: |
          curl -sf "https://github-contributions-api.jogruber.de/v4/kevanwee?y=last" -o "$RUNNER_TEMP/contributions.json"
          gh repo list kevanwee --limit 100 --json name,description,isPrivate,isFork,pushedAt > "$RUNNER_TEMP/repos.json"
          # Public activity, plus (with the LOG_TOKEN secret, a read-only token scoped to the allowlisted private
          # repos) each private repo's own feed. build_log.py keeps only kevanwee's events and names private
          # repos only if they are in PRIVATE_SHOWN.
          gh api "users/kevanwee/events/public?per_page=100" > "$RUNNER_TEMP/public-events.json"
          echo '[]' > "$RUNNER_TEMP/private-events.json"
          if [ -n "$LOG_TOKEN" ]; then
            GH_TOKEN="$LOG_TOKEN" gh api "repos/kevanwee/voracity/events?per_page=100" > "$RUNNER_TEMP/private-events.json" || echo '[]' > "$RUNNER_TEMP/private-events.json"
          fi
          jq -s 'add | unique_by(.id) | sort_by(.created_at) | reverse' "$RUNNER_TEMP/public-events.json" "$RUNNER_TEMP/private-events.json" > "$RUNNER_TEMP/events.json"
          echo "events: $(jq length "$RUNNER_TEMP/events.json") (private: $(jq '[.[] | select(.public == false)] | length' "$RUNNER_TEMP/events.json"))"
      - name: Regrow
        working-directory: genpokemon/readme_art
        env:
          TZ: Asia/Singapore
        run: |
          python regrow.py "$RUNNER_TEMP/contributions.json" "$RUNNER_TEMP/repos.json" ../../readme/art "$RUNNER_TEMP/events.json"
          # Explorer Rank (all-time contributions) and Castform's 24-hour forecast (NEA)
          curl -sf "https://github-contributions-api.jogruber.de/v4/kevanwee?y=all" -o "$RUNNER_TEMP/all-contributions.json"
          curl -sf "https://api-open.data.gov.sg/v2/real-time/api/twenty-four-hr-forecast" -o "$RUNNER_TEMP/forecast.json"
          python build_pmdui.py "$RUNNER_TEMP/all-contributions.json" "$RUNNER_TEMP/forecast.json" ../../readme/art
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add readme/art
          git diff --cached --quiet || (git commit -m "Regrow the README garden" && git push)
