name: Regrow the README garden

# Every two hours: the contribution garden with the sky over its forest (Singapore's time of day and
# NEA's 2-hour forecast) and the README's open card spots. Diancie has a separate workflow.
# Also on each push to main (the bot's own regrow commits use GITHUB_TOKEN, so they never trigger it).
# Commits authored as kevanwee (the account's noreply address), so each regrow counts on the contribution graph:
# the owner's choice, as a visible sign the pipeline is alive. It still pushes with GITHUB_TOKEN, so the push
# event's actor is github-actions[bot] and the message log leaves these commits out.
on:
  schedule:
    - cron: "17 1-23/2 * * *" # the separate activity workflow refreshes Diancie every five minutes
  push:
    branches: [main]
    paths-ignore: ["readme/art/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency: readme-garden

jobs:
  regrow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow and metric-compatible fonts
        run: |
          pip install pillow
          sudo apt-get install -y fonts-liberation
      - name: Fetch the contribution calendar and repositories
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sf "https://github-contributions-api.jogruber.de/v4/kevanwee?y=last" -o "$RUNNER_TEMP/contributions.json"
          gh repo list kevanwee --limit 100 --json name,description,isPrivate,isFork,pushedAt > "$RUNNER_TEMP/repos.json"
      - name: Regrow
        working-directory: genpokemon/readme_art
        env:
          TZ: Asia/Singapore
        run: |
          python regrow.py "$RUNNER_TEMP/contributions.json" "$RUNNER_TEMP/repos.json" ../../readme/art
          # Explorer Rank (all-time contributions) and Castform's 24-hour forecast (NEA)
          curl -sf "https://github-contributions-api.jogruber.de/v4/kevanwee?y=all" -o "$RUNNER_TEMP/all-contributions.json"
          curl -sf "https://api-open.data.gov.sg/v2/real-time/api/twenty-four-hr-forecast" -o "$RUNNER_TEMP/forecast.json"
          python build_pmdui.py "$RUNNER_TEMP/all-contributions.json" "$RUNNER_TEMP/forecast.json" ../../readme/art
      - name: Commit if anything changed
        run: |
          git config user.name "kevanwee"
          git config user.email "16420323+kevanwee@users.noreply.github.com"
          git add readme/art
          git diff --cached --quiet || (git commit -m "Regrow the README garden" && git push)
